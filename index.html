<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Linea Racer</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #10151c; }
    body { font-family: Arial, sans-serif; }
    .garage { position:fixed; inset:0; display:none; align-items:center; justify-content:center; overflow:hidden; background:radial-gradient(circle at 50% 28%,#303640 0,#11151b 48%,#07090d 100%); color:#fff; z-index:5; }
    .passenger-dialog { position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(0,0,0,.58); backdrop-filter:blur(5px); color:#fff; }
    .passenger-dialog.on { display:flex; }
    .passenger-card { width:min(92vw,420px); padding:28px 22px 22px; border:1px solid rgba(255,255,255,.18); border-radius:22px; background:linear-gradient(180deg,rgba(25,31,39,.98),rgba(10,14,19,.98)); box-shadow:0 20px 60px rgba(0,0,0,.55); text-align:center; }
    .passenger-card h2 { margin:0 0 10px; font-size:clamp(24px,7vw,34px); letter-spacing:2px; }
    .passenger-card p { margin:0 0 22px; font-size:clamp(15px,4vw,19px); font-weight:800; letter-spacing:1px; }
    .passenger-actions { display:flex; flex-direction:column; gap:10px; }
    .passenger-actions button { width:100%; padding:14px 12px; border:0; border-radius:12px; background:#e31b23; color:#fff; font-weight:900; letter-spacing:1px; font-size:14px; cursor:pointer; }
    .passenger-actions button:last-child { background:#252d36; border:1px solid rgba(255,255,255,.16); }
    .passenger-actions button:active { transform:scale(.98); }
    .passenger-status { position:fixed; right:14px; top:74px; z-index:4; display:none; padding:9px 12px; border-radius:11px; background:rgba(8,12,16,.78); border:1px solid rgba(255,255,255,.14); color:#ffd24a; font-size:11px; font-weight:900; letter-spacing:.7px; box-shadow:0 8px 25px rgba(0,0,0,.25); }
    .passenger-status.on { display:block; }
    .garage.on { display:flex; }
    .garage:before { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(255,255,255,.04),transparent 38%,rgba(0,0,0,.42)); pointer-events:none; }
    .garage-floor { position:absolute; left:-15%; right:-15%; bottom:-18%; height:58%; background:linear-gradient(180deg,#242a31,#0c1015); transform:perspective(500px) rotateX(57deg); transform-origin:bottom; box-shadow:0 -20px 80px rgba(0,0,0,.45) inset; }
    .garage-title { position:absolute; top:7%; left:50%; transform:translateX(-50%); text-align:center; letter-spacing:5px; font-weight:900; font-size:clamp(28px,6vw,54px); text-shadow:0 5px 22px #000; z-index:4; white-space:nowrap; }
    .garage-title:after { content:""; display:block; width:110px; height:3px; margin:12px auto 0; border-radius:4px; background:#e31b23; box-shadow:0 0 18px rgba(227,27,35,.55); }
    .garage-info { position:absolute; right:7%; top:19%; z-index:4; min-width:170px; padding:14px 16px; border:1px solid rgba(255,255,255,.12); border-radius:16px; background:rgba(8,12,16,.66); backdrop-filter:blur(10px); box-shadow:0 14px 35px rgba(0,0,0,.3); text-align:left; }
    .garage-info .k { display:block; font-size:10px; letter-spacing:2px; opacity:.52; margin-bottom:5px; }
    .garage-info .v { font-size:22px; font-weight:900; }
    .garage-info .unit { font-size:12px; opacity:.6; margin-left:3px; }
    .garage-button { bottom:6%; }
    .garage-back { left:7%; right:auto; top:auto; bottom:6%; padding:11px 18px; font-size:12px; background:#1b222a; border:1px solid rgba(255,255,255,.22); box-shadow:0 10px 28px rgba(0,0,0,.38); }
    .garage-picker { bottom:15%; }
    .garage-label { bottom:6%; }
    @media(max-width:600px){ .garage-title{top:5%;font-size:clamp(25px,7vw,38px)} .garage-back{top:auto;bottom:6%;left:5%;padding:13px 17px;font-size:12px}.garage-info{right:5%;top:14%;min-width:125px;padding:10px 12px}.garage-info .v{font-size:18px}.garage-picker{bottom:18%;max-width:96vw}.garage-label{bottom:7%;left:5%;font-size:13px}.garage-button{bottom:6%;right:5%;padding:13px 19px} }
    .garage-sub { display:block; margin-top:8px; font-size:12px; letter-spacing:3px; opacity:.58; }
    .garage-car { position:relative; z-index:2; width:min(62vw,360px); max-height:62vh; object-fit:contain; opacity:1 !important; filter:drop-shadow(0 28px 22px rgba(0,0,0,.72)) saturate(1.08) brightness(1.05); transform:translateY(2%); }
    .garage-label { position:absolute; left:7%; bottom:8%; z-index:3; font-weight:800; letter-spacing:2px; font-size:18px; color:#fff; text-shadow:0 3px 14px #000; }
    .garage-button { position:absolute; right:7%; bottom:7%; z-index:3; border:0; border-radius:14px; padding:13px 21px; background:#e31b23; color:#fff; font-weight:900; letter-spacing:2px; font-size:16px; box-shadow:0 10px 30px rgba(227,27,35,.28); }
    .garage-picker { position:absolute; left:50%; bottom:17%; transform:translateX(-50%); z-index:4; display:flex; gap:10px; padding:8px; border-radius:18px; background:rgba(8,12,16,.72); backdrop-filter:blur(8px); }
    .garage-pick { border:1px solid rgba(255,255,255,.18); border-radius:12px; padding:10px 15px; background:rgba(255,255,255,.06); color:#fff; font-weight:800; letter-spacing:1px; cursor:pointer; }
    .garage-pick.active { background:#e31b23; border-color:#ff5960; box-shadow:0 8px 24px rgba(227,27,35,.22); }
    .garage-pick small { display:block; margin-top:4px; font-size:10px; opacity:1; letter-spacing:1px; color:#fff; }
    .garage-pick.active small { opacity:.9; }
    @media(max-width:600px){.garage-picker{bottom:18%;gap:5px;max-width:94vw}.garage-pick{padding:9px 9px;font-size:10px}.garage-car{width:min(68vw,310px)} .garage-label{left:6%;bottom:7%;font-size:14px}.garage-button{right:6%;bottom:6%;padding:11px 17px;font-size:12px}}
    @media(max-width:600px){.garage-car{width:min(68vw,310px)} .garage-label{left:6%;bottom:7%;font-size:14px}.garage-button{right:6%;bottom:6%;padding:11px 17px;font-size:12px}}
    .home { position:fixed; inset:0; z-index:6; display:flex; align-items:center; justify-content:center; overflow:hidden; color:#fff; background:linear-gradient(180deg,#102033 0%,#243b55 48%,#10161d 100%); }
    .home.hidden { display:none; }

      position:absolute; inset:0; overflow:hidden;
      background:
        radial-gradient(circle at 72% 22%, rgba(235,175,96,.30), transparent 28%),

    }

    let W = 0, H = 0, dpr = 1, lastTime = performance.now();
    let state = "menu"; // menu, playing, paused, burning, gameover
    let garageOpen = true;
    let passengerMission = "none"; // none, waiting, dialog, active, done, declined
    let passengerDialogOpen = false;
    let selectedVehicle = "linea";
    let cars = [], particles = [], scoreCoins = [], scorePopups = [];
    let playerLane = 3, targetLane = 3;
    let speed = 0, distance = 0, score = 0, finalScore = 0, bestScore = 0;
    let elapsed = 0, roadScroll = 0, curvePhase = 0, spawnTimer = 0.8;
    let burnTime = 0, drivePhase = 0, trafficBeat = 0, signDistance = 0;
    let braking = false, accelerating = false, brakeAmount = 0, brakePointerId = null, gasPointerId = null;
    let playerLaneVelocity = 0, playerForward = 0, steerInput = 0, touchSteer = 0, steerPointerId = null;
    const heldKeys = new Set();
    // Regular, alternating traffic keeps at least one useful escape lane available.
    const trafficPattern = [[0,2],[1],[0,3],[2],[1,3],[0],[2,3],[1]];

    const sprites = { linea: null, clio: null, clioOrange: null, peugeot: null };
    const trafficKinds = ["clio","clio","clioOrange","peugeot","linea"];
    const vehicleMaxSpeed = { linea: 180, clioOrange: 190, peugeot: 200 };
    const imageReady = { linea: false, clio: false, clioOrange: false, peugeot: false };
    const homeEl = document.getElementById("home");
    const homeStartEl = document.getElementById("homeStart");
    const homeGarageEl = document.getElementById("homeGarage");
    const garageEl = document.getElementById("garage");
    const garageCarEl = document.getElementById("garageCar");
    const garageStartEl = document.getElementById("garageStart");
    const garageBackEl = document.getElementById("garageBack");
    const garageLabelEl = document.getElementById("garageLabel");
    const garageSpeedEl = document.getElementById("garageSpeed");
    const garagePickEls = [...document.querySelectorAll(".garage-pick")];
    const passengerDialogEl = document.getElementById("passengerDialog");
    const passengerYesEl = document.getElementById("passengerYes");
    const passengerNoEl = document.getElementById("passengerNo");
    const passengerStatusEl = document.getElementById("passengerStatus");
    function updateGarage() {
      garageCarEl.src = assetPaths[selectedVehicle];
      const label = selectedVehicle === "clioOrange" ? "TURUNCU RENAULT CLIO" : selectedVehicle === "peugeot" ? "PEUGEOT 3008" : "FIAT LINEA";
      garageCarEl.alt = label;
      garageLabelEl.innerHTML = label + '<br><span style="font-size:12px;opacity:.55;letter-spacing:1px">OYUNCU ARACI</span>';
      garageSpeedEl.innerHTML = vehicleMaxSpeed[selectedVehicle] + '<span class="unit">KM/H</span>';
      garagePickEls.forEach(btn => btn.classList.toggle("active", btn.dataset.vehicle === selectedVehicle));
    }
    garagePickEls.forEach(btn => btn.addEventListener("click", () => { selectedVehicle = btn.dataset.vehicle; updateGarage(); }));
    updateGarage();
    function openRace() { garageOpen = false; homeEl.classList.add("hidden"); garageEl.classList.remove("on"); resetGame(); }
    function openGarage() { garageOpen = true; homeEl.classList.add("hidden"); garageEl.classList.add("on"); }
    function openHome() { garageOpen = true; garageEl.classList.remove("on"); homeEl.classList.remove("hidden"); state = "menu"; }
    homeStartEl.addEventListener("click", openRace);
    homeGarageEl.addEventListener("click", openGarage);
    garageStartEl.addEventListener("click", openRace);
    garageBackEl.addEventListener("click", openHome);

    function openPassengerDialog() {
      if (passengerMission !== "waiting" || passengerDialogOpen) return;
      passengerMission = "dialog";
      passengerDialogOpen = true;
      passengerDialogEl.classList.add("on");
      passengerDialogEl.setAttribute("aria-hidden", "false");
      braking = false; accelerating = false;
    }
    function closePassengerDialog(accepted) {
      passengerDialogOpen = false;
      passengerDialogEl.classList.remove("on");
      passengerDialogEl.setAttribute("aria-hidden", "true");
      passengerMission = accepted ? "active" : "declined";
      passengerStatusEl.classList.toggle("on", accepted);
      if (!accepted) passengerStatusEl.classList.remove("on");
    }
    passengerYesEl.addEventListener("click", () => closePassengerDialog(true));
    passengerNoEl.addEventListener("click", () => closePassengerDialog(false));

    try { bestScore = Number(localStorage.getItem("lineaRacerBest")) || 0; } catch (_) {}

    function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
    function rand(min, max) { return min + Math.random() * (max - min); }
    function horizon() { return H * 0.04; }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener("resize", resize);
    resize();

    // The supplied photos have a white studio background. Only the white area
    // connected to an image edge is removed, so the white Clio itself remains intact.
    function makeSpriteTransparent(image) {
      const source = document.createElement("canvas");
      source.width = image.naturalWidth;
      source.height = image.naturalHeight;
      const sourceCtx = source.getContext("2d", { willReadFrequently: true });
      sourceCtx.drawImage(image, 0, 0);
      const pixels = sourceCtx.getImageData(0, 0, source.width, source.height);
      const data = pixels.data;
      const seen = new Uint8Array(source.width * source.height);
      const pending = [];
      const isStudioWhite = index => data[index * 4] > 238 && data[index * 4 + 1] > 238 && data[index * 4 + 2] > 238;
      const add = index => {
        if (!seen[index] && isStudioWhite(index)) {
          seen[index] = 1;
          pending.push(index);
        }
      };

      for (let x = 0; x < source.width; x++) {
        add(x);
        add((source.height - 1) * source.width + x);
      }
      for (let y = 1; y < source.height - 1; y++) {
        add(y * source.width);
        add(y * source.width + source.width - 1);
      }
      while (pending.length) {
        const index = pending.pop();
        data[index * 4 + 3] = 0;
        const x = index % source.width;
        const y = Math.floor(index / source.width);
        if (x) add(index - 1);
        if (x + 1 < source.width) add(index + 1);
        if (y) add(index - source.width);
        if (y + 1 < source.height) add(index + source.width);
      }
      sourceCtx.putImageData(pixels, 0, 0);

      let left = source.width, top = source.height, right = 0, bottom = 0;
      for (let y = 0; y < source.height; y++) {
        for (let x = 0; x < source.width; x++) {
          if (data[(y * source.width + x) * 4 + 3] > 8) {
            left = Math.min(left, x); top = Math.min(top, y);
            right = Math.max(right, x); bottom = Math.max(bottom, y);
          }
        }
      }
      if (right <= left || bottom <= top) return source;
      const padding = 6;
      const crop = document.createElement("canvas");
      crop.width = right - left + 1 + padding * 2;
      crop.height = bottom - top + 1 + padding * 2;
      crop.getContext("2d").drawImage(source, left, top, right - left + 1, bottom - top + 1, padding, padding, right - left + 1, bottom - top + 1);
      return crop;
    }

    function loadSprite(name) {
      const image = new Image();
      image.onload = () => {
        try { sprites[name] = makeSpriteTransparent(image); }
        catch (_) { sprites[name] = image; }
        imageReady[name] = true;
      };
      image.src = assetPaths[name];
    }

    loadSprite("linea");
    loadSprite("clio");
    loadSprite("clioOrange");
    loadSprite("peugeot");

    function roadCenterAt(y) { return W / 2; }

    function roadWidthAt(y) { return Math.min(W * 0.86, 560); }

    function laneX(lane, y) {
      const rw = roadWidthAt(y);
      return W / 2 - rw / 2 + rw * ((lane + 0.5) / 4);
    }

    function playerGeometry() {
      const bob = state === "playing" ? Math.sin(drivePhase * 2) * (1.2 + speed * 0.004) : 0;
      const y = H * 0.82 + bob;
      const w = Math.min(78, roadWidthAt(y) / 4 * 0.62);
      const aspect = selectedVehicle === "clioOrange" ? (282 / 520) : selectedVehicle === "peugeot" ? (283 / 520) : (219 / 340);
      return { x: laneX(playerLane, y), y, w, h: w / aspect, bob, scale: 1 };
    }

    function otherCarGeometry(car) {
      const y = H * 0.06 + car.z * H * 0.78;
      const baseW = Math.min(70, roadWidthAt(y) / 4 * 0.58);
      const sizeMul = car.kind === "clioOrange" ? 1.02 : car.kind === "peugeot" ? 1.06 : car.kind === "linea" ? 1.02 : 1;
      const w = baseW * sizeMul;
      const aspect = car.kind === "clioOrange" ? (282 / 520) : car.kind === "peugeot" ? (283 / 520) : car.kind === "linea" ? (219 / 340) : (1 / 1.62);
      return { x: laneX(car.lane, y), y, w, h: w / aspect };
    }

    function resetGame() {
      cars = [];
      particles = [];
      scoreCoins = [];
      scorePopups = [];
      playerLane = targetLane = 3;
      speed = 0;
      distance = score = finalScore = elapsed = roadScroll = curvePhase = burnTime = drivePhase = signDistance = 0;
      passengerMission = "none";
      passengerDialogOpen = false;
      passengerDialogEl.classList.remove("on");
      passengerStatusEl.classList.remove("on");
      spawnTimer = 1.65;
      trafficBeat = 0;
      braking = false;
      brakeAmount = 0;
      brakePointerId = null;
      gasPointerId = null;
      steerPointerId = null;
      touchSteer = 0;
      steerInput = 0;
      accelerating = false;
      heldKeys.clear();
      playerLaneVelocity = 0;
      playerForward = 0;
      state = "playing";
    }

    function moveLane(direction) {
      if (state === "playing") targetLane = clamp(targetLane + direction, 0, 3);
    }

    function togglePause() {
      if (state === "playing") { braking = false; accelerating = false; brakeAmount = 0; state = "paused"; }
      else if (state === "paused") state = "playing";
    }

    function spawnCar() {
      // Low-density traffic: never fill all four lanes. A spawn row uses at most
      // two lanes and keeps a large readable gap for overtakes / weaving.
      if (cars.filter(car => car.z < 0.62).length >= 2) return false;
      const row = trafficPattern[trafficBeat % trafficPattern.length];
      const near = cars.filter(car => car.z < 0.42);
      const occupied = new Set(near.map(car => car.lane));
      const safeRow = row.filter(lane => !occupied.has(lane));
      if (!safeRow.length) return false;
      trafficBeat++;
      const baseZ = 0.015;
      safeRow.slice(0, 2).forEach((lane, index) => {
        cars.push({
          lane,
          z: baseZ + index * 0.055,
          crashed: false,
          trafficSpeed: rand(72, 104),
          approach: rand(0.86, 1.04),
          weave: Math.random() * Math.PI * 2,
          kind: trafficKinds[Math.floor(Math.random() * trafficKinds.length)]
        });
      });
      return true;
    }

    function addExplosion(x, y) {
      particles.push({ x, y, vx: 0, vy: 0, size: 12, life: 0.42, maxLife: 0.42, type: "shock" });
      for (let i = 0; i < 86; i++) {
        const roll = Math.random();
        const type = roll < 0.48 ? "fire" : roll < 0.81 ? "smoke" : "ember";
        particles.push({
          x: x + rand(-35, 35), y: y + rand(-45, 50),
          vx: rand(-175, 175), vy: type === "smoke" ? rand(-155, -40) : rand(-255, 65),
          size: type === "smoke" ? rand(14, 30) : type === "ember" ? rand(2, 6) : rand(9, 25),
          life: type === "smoke" ? rand(0.75, 1.55) : type === "ember" ? rand(0.55, 1.1) : rand(0.45, 1.18),
          maxLife: type === "smoke" ? 1.55 : type === "ember" ? 1.1 : 1.18,
          wind: rand(-18, 18), type
        });
      }
    }

    function emitBurningParticles(dt) {
      const p = playerGeometry();
      const flameCount = Math.max(1, Math.round(dt * 125));
      for (let i = 0; i < flameCount; i++) {
        particles.push({
          x: p.x + rand(-p.w * 0.30, p.w * 0.30), y: p.y + rand(-p.h * 0.10, p.h * 0.35),
          vx: rand(-52, 52), vy: rand(-145, -55), size: rand(13, 29),
          life: rand(0.35, 0.78), maxLife: 0.78, wind: rand(-14, 14), type: "fire"
        });
      }
      if (Math.random() < dt * 35) {
        particles.push({
          x: p.x + rand(-p.w * 0.25, p.w * 0.25), y: p.y - p.h * 0.12,
          vx: rand(-28, 28), vy: rand(-108, -45), size: rand(20, 38),
          life: rand(0.72, 1.45), maxLife: 1.45, wind: rand(-15, 15), type: "smoke"
        });
      }
      if (Math.random() < dt * 60) {
        particles.push({
          x: p.x + rand(-p.w * 0.34, p.w * 0.34), y: p.y + rand(-p.h * 0.05, p.h * 0.30),
          vx: rand(-70, 70), vy: rand(-155, -35), size: rand(2, 5),
          life: rand(0.45, 0.95), maxLife: 0.95, wind: rand(-8, 8), type: "ember"
        });
      }
    }

    function crash(car) {
      if (state !== "playing") return;
      car.crashed = true;
      const p = playerGeometry();
      addExplosion(p.x, p.y);
      finalScore = Math.floor(score);
      burnTime = 0;
      braking = false;
      state = "burning";
    }

    function updateParticles(dt) {
      particles = particles.filter(p => {
        p.life -= dt;
        p.x += (p.vx + (p.wind || 0)) * dt;
        p.y += p.vy * dt;
        if (p.type === "smoke") {
          p.vy -= 15 * dt;
          p.size += 17 * dt;
        } else if (p.type === "ember") {
          p.vy += 285 * dt;
          p.size -= 1.5 * dt;
        } else if (p.type === "shock") {
          p.size += 165 * dt;
        } else {
          p.vy += 220 * dt;
          p.size -= 6 * dt;
        }
        return p.life > 0 && p.size > 1;
      });
    }

    function spawnScoreCoin() {
      if (scoreCoins.length >= 3) return;
      const activeCoins = scoreCoins.filter(c => c.z < 0.78);
      if (activeCoins.length >= 2) return;

      // Trafiğin yoğun olduğu noktaya coin koymamak için uygun bir şerit seç.
      const candidates = [0, 1, 2, 3].filter(lane => {
        return !cars.some(car => car.lane === lane && car.z < 0.55 && Math.abs(car.z - 0.30) < 0.24);
      });
      if (!candidates.length) return;

      const lane = candidates[Math.floor(Math.random() * candidates.length)];
      scoreCoins.push({
        lane,
        z: 0.02 + Math.random() * 0.10,
        spin: Math.random() * Math.PI * 2,
        phase: Math.random() * Math.PI * 2
      });
    }

    function scoreCoinGeometry(coin) {
      const y = H * 0.06 + coin.z * H * 0.78;
      const x = laneX(coin.lane, y);
      const size = clamp(8.5 + coin.z * 9.5, 8.5, 18);
      return { x, y, size };
    }

    function drawScoreCoins() {
      for (const coin of scoreCoins) {
        const g = scoreCoinGeometry(coin);
        const pulse = 1 + Math.sin(coin.phase) * 0.08;
        const width = g.size * (0.58 + Math.abs(Math.cos(coin.spin)) * 0.42) * pulse;

        ctx.save();
        ctx.translate(g.x, g.y);
        ctx.shadowColor = "rgba(255,190,30,.45)";
        ctx.shadowBlur = g.size * 0.9;

        // Coin gölgesi
        ctx.shadowColor = "rgba(0,0,0,.35)";
        ctx.shadowBlur = 5;
        ctx.shadowOffsetY = 3;
        ctx.fillStyle = "rgba(0,0,0,.30)";
        ctx.beginPath();
        ctx.ellipse(0, g.size * 0.82, width * 0.95, g.size * 0.20, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowColor = "rgba(255,205,45,.55)";
        ctx.shadowBlur = g.size * 0.9;
        const grad = ctx.createLinearGradient(-width, -g.size, width, g.size);
        grad.addColorStop(0, "#8e5a00");
        grad.addColorStop(0.18, "#ffd84a");
        grad.addColorStop(0.52, "#fff0a0");
        grad.addColorStop(0.78, "#e6a515");
        grad.addColorStop(1, "#7b4a00");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(0, 0, width, g.size, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.strokeStyle = "rgba(255,248,190,.9)";
        ctx.lineWidth = Math.max(1, g.size * 0.10);
        ctx.beginPath();
        ctx.ellipse(0, 0, width * 0.82, g.size * 0.82, 0, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = "#8a5700";
        ctx.font = "900 " + Math.max(7, g.size * 0.72) + "px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("50", 0, 0.5);

        ctx.restore();
        coin.spin += 0.11;
        coin.phase += 0.08;
      }
    }

    function updateScoreCoins(dt) {
      if (state !== "playing") return;

      // Ortalama 3 saniyede bir: ne çok sık ne de çok seyrek.
      if (!updateScoreCoins.timer) updateScoreCoins.timer = 2.4 + Math.random() * 1.6;
      updateScoreCoins.timer -= dt;

      if (updateScoreCoins.timer <= 0) {
        if (Math.random() < 0.78) spawnScoreCoin();
        updateScoreCoins.timer = 2.7 + Math.random() * 2.0;
      }

      for (const coin of scoreCoins) {
        // Trafik araçları gibi: oyuncu durduğunda coinler kaçmaz.
        // Oyuncu coinlerden hızlıysa yaklaşır; yavaşsa çok hafif uzaklaşır.
        const relative = clamp((speed - 72) / 120, -0.18, 1.25);
        if (speed < 8) {
          coin.z += dt * 0.16 * Math.max(0, relative);
        } else {
          coin.z += dt * 0.16 * relative;
        }
        coin.phase += dt * 4.2;
      }

      const player = playerGeometry();
      for (let i = scoreCoins.length - 1; i >= 0; i--) {
        const coin = scoreCoins[i];
        const g = scoreCoinGeometry(coin);
        const closeX = Math.abs(player.x - g.x) < player.w * 0.43;
        const closeY = Math.abs(player.y - g.y) < player.h * 0.30;

        if (closeX && closeY) {
          score += 50;
          scorePopups.push({ x: g.x, y: g.y, life: 0.95, maxLife: 0.95 });
          scoreCoins.splice(i, 1);
        }
      }

      scoreCoins = scoreCoins.filter(coin => coin.z < 1.13);
    }

    function drawScorePopups() {
      for (const p of scorePopups) {
        const alpha = clamp(p.life / p.maxLife, 0, 1);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.textAlign = "center";
        ctx.font = "900 18px Arial";
        ctx.lineWidth = 4;
        ctx.strokeStyle = "rgba(0,0,0,.72)";
        ctx.strokeText("+50", p.x, p.y);
        ctx.fillStyle = "#ffd84a";
        ctx.fillText("+50", p.x, p.y);
        ctx.restore();
      }
    }

    function update(dt) {
      updateParticles(dt);
      if (passengerDialogOpen) return;
      if (state === "paused" || state === "menu" || state === "gameover") return;

      if (state === "burning") {
        burnTime += dt;
        speed = Math.max(0, speed - 135 * dt);
        roadScroll = (roadScroll + dt * 0.16) % 1;
        emitBurningParticles(dt);
        if (burnTime > 2.35) {
          state = "gameover";
          if (finalScore > bestScore) {
            bestScore = finalScore;
            try { localStorage.setItem("lineaRacerBest", String(bestScore)); } catch (_) {}
          }
        }
        return;
      }

      // Skor yalnızca gerçek mesafe alırken ilerler. Araç durduğunda tamamen donar.
      if (speed > 1.5) elapsed += dt;
      brakeAmount += ((braking ? 1 : 0) - brakeAmount) * Math.min(1, dt * 10);
      if (braking) speed = Math.max(0, speed - dt * 125);
      else if (accelerating) speed = Math.min(vehicleMaxSpeed[selectedVehicle], speed + dt * 58);
      else speed = Math.max(0, speed - dt * 7);
      distance += (speed / 3.6) * dt;
      signDistance += (speed / 3.6) * dt;
      // 10 KM'de sağ taraftaki 5 yolcu için durma noktası oluşur.
      if (passengerMission === "none" && distance >= 9000) passengerMission = "waiting";
      if (passengerMission === "waiting" && distance >= 10000 && distance <= 12000 && speed < 7 && playerLane >= 2) {
        openPassengerDialog();
      }
      if (passengerMission === "active" && distance >= 15000) {
        passengerMission = "done";
        passengerStatusEl.textContent = "GÖREV TAMAMLANDI • 5 YOLCU GÜVENDE";
        passengerStatusEl.classList.add("on");
        setTimeout(() => { if (passengerMission === "done") passengerStatusEl.classList.remove("on"); }, 2200);
      }

      // 1 metre ≈ 0.2 puan: hız yükseldikçe skor düzenli artar, aşırı şişmez.
      if (speed > 1.5) score += (speed / 3.6) * 0.2 * dt;
      updateScoreCoins(dt);
      scorePopups.forEach(p => {
        p.life -= dt;
        p.y -= dt * 32;
      });
      scorePopups = scorePopups.filter(p => p.life > 0);
      roadScroll = (roadScroll + dt * (speed / 100) * 0.62) % 1;
      curvePhase += dt * 0.18;
      drivePhase += dt * (3.8 + speed / 70);
      const forwardTarget = braking ? 0.28 : 0.84 + clamp((speed - 70) / 180, 0, 0.15);
      playerForward += (forwardTarget - playerForward) * Math.min(1, dt * (braking ? 5.4 : 2.4));

      // A damped lane spring gives turns a clean arc and a small, natural body roll.
      const laneError = targetLane - playerLane;
      playerLaneVelocity += laneError * 55 * dt;
      playerLaneVelocity *= Math.exp(-10 * dt);
      const nextLane = playerLane + playerLaneVelocity * dt;
      if ((targetLane - playerLane) * (targetLane - nextLane) <= 0) {
        playerLane = targetLane;
        playerLaneVelocity = 0;
      } else {
        playerLane = clamp(nextLane, 0, 3);
      }

      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        const spawned = spawnCar();
        spawnTimer = spawned ? Math.max(1.55, 2.15 - speed / 900) : 0.45;
      }
      // Same-direction traffic has real speed differences. Faster traffic closes
      // more slowly, slower traffic becomes an overtaking target.
      cars.forEach(car => {
        const relative = clamp((speed - car.trafficSpeed) / 120, -1.15, 1.55);
        // Oyuncu durduğunda trafik gözden kaybolup uzaklaşmasın.
        // Önümüzdeki araçlar görüşün dışındaki bir mesafede bekler;
        // oyuncu tekrar hızlanınca normal göreli hareket devam eder.
        if (speed < 14 && car.z < 0.96) {
          car.z += Math.max(0, relative) * dt * 0.16 * car.approach;
          car.z = Math.min(car.z, 0.96);
        } else {
          car.z += dt * 0.16 * relative * car.approach;
        }
      });

      const player = playerGeometry();
      for (const car of cars) {
        const other = otherCarGeometry(car);
        const hitX = Math.abs(player.x - other.x) < (player.w + other.w) * 0.36;
        const hitY = Math.abs(player.y - other.y) < (player.h + other.h) * 0.43;
        if (hitX && hitY) { crash(car); break; }
      }
      // Cars clear just after they pass the player, keeping the weave readable.
      cars = cars.filter(car => car.z < 1.16);
    }

    function roundedRect(x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function drawSky() {
      const sky = ctx.createLinearGradient(0, 0, 0, horizon());
      sky.addColorStop(0, "#5ba6d7"); sky.addColorStop(1, "#d7edf3");
      ctx.fillStyle = sky; ctx.fillRect(0, 0, W, horizon());
      ctx.fillStyle = "#dfeff2";
      ctx.beginPath(); ctx.moveTo(0, horizon() * 0.78);
      for (let x = 0; x <= W; x += 70) ctx.lineTo(x, horizon() * (0.66 + Math.sin(x * 0.02) * 0.08));
      ctx.lineTo(W, horizon()); ctx.lineTo(0, horizon()); ctx.fill();
    }

    function drawPassengers() {
      if (passengerMission !== "waiting" || distance > 12000) return;

      // Sağ bankette, yol çizgisinin hemen dışında 5 ayrı otostopçu.
      const roadRight = W / 2 + roadWidthAt(H * .60) / 2;
      const baseX = Math.min(W - 44, roadRight + Math.min(82, W * .095));
      const startY = H * .20;
      const gap = Math.min(88, H * .098);
      const scale = clamp(W / 900, .72, 1.02);

      const people = [
        { shirt:"#4a78a0", pants:"#252b32", hair:"#d79b46", skin:"#f1c39a", backpack:"#263f56", pose:1 },
        { shirt:"#777777", pants:"#202328", hair:"#4a3024", skin:"#d8a47c", backpack:"#39434a", pose:1 },
        { shirt:"#9a8a78", pants:"#303238", hair:"#4b2d20", skin:"#c9875e", backpack:"#514536", pose:1 },
        { shirt:"#4c7649", pants:"#263b48", hair:"#bd633c", skin:"#efb184", backpack:"#315038", pose:1 },
        { shirt:"#c83e3c", pants:"#30353a", hair:"#252525", skin:"#8e5b42", backpack:"#742f2c", pose:1 }
      ];

      function person(px, py, s, p) {
        ctx.save();
        ctx.translate(px, py);
        ctx.scale(s, s);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        // Yumuşak yer gölgesi.
        ctx.fillStyle = "rgba(0,0,0,.18)";
        ctx.beginPath();
        ctx.ellipse(0, 4, 14, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        // Sırt çantası.
        ctx.fillStyle = p.backpack;
        ctx.beginPath();
        ctx.roundRect(-15, -40, 10, 29, 5);
        ctx.fill();

        // Bacaklar.
        ctx.strokeStyle = "#20242a";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(-4, -7); ctx.lineTo(-7, 2);
        ctx.moveTo(4, -7); ctx.lineTo(7, 2);
        ctx.stroke();

        // Ayakkabılar.
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-9, 2); ctx.lineTo(-4, 2);
        ctx.moveTo(4, 2); ctx.lineTo(10, 2);
        ctx.stroke();

        // Gövde.
        ctx.fillStyle = p.shirt;
        ctx.beginPath();
        ctx.roundRect(-12, -43, 24, 35, 8);
        ctx.fill();
        ctx.strokeStyle = "rgba(0,0,0,.42)";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Boyun.
        ctx.fillStyle = p.skin;
        ctx.fillRect(-4, -49, 8, 9);

        // Baş.
        ctx.fillStyle = p.skin;
        ctx.beginPath();
        ctx.arc(0, -58, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "rgba(0,0,0,.5)";
        ctx.lineWidth = 1.2;
        ctx.stroke();

        // Saç.
        ctx.fillStyle = p.hair;
        ctx.beginPath();
        ctx.arc(0, -62, 10, Math.PI, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(-7, -59, 4, 3.5, 5.8);
        ctx.arc(7, -59, 4, 3.6, 5.9);
        ctx.fill();

        // Gözler.
        ctx.fillStyle = "#171717";
        ctx.beginPath();
        ctx.arc(-3.2, -58, 1.1, 0, Math.PI*2);
        ctx.arc(3.2, -58, 1.1, 0, Math.PI*2);
        ctx.fill();

        // Sol kol aşağıda.
        ctx.strokeStyle = p.skin;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(-10, -36); ctx.lineTo(-16, -17);
        ctx.stroke();

        // Sağ kol: belirgin otostop pozu.
        ctx.beginPath();
        ctx.moveTo(10, -36); ctx.lineTo(18, -25); ctx.lineTo(27, -25);
        ctx.stroke();

        // Başparmak yukarı.
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(27, -25); ctx.lineTo(29, -31);
        ctx.stroke();

        ctx.restore();
      }

      people.forEach((p, i) => {
        const s = scale * (i === 0 || i === 4 ? .92 : .98);
        const x = baseX + ((i % 2) ? 3 : -2);
        const y = startY + i * gap;
        person(x, y, s, p);
      });
    }

    function drawRoadSigns() {
      // 2D görünümde tabelalar yolun üstüne değil, yol kenarındaki
      // bankete yerleştirilir. Böylece arabalar tabelaların altından geçmez.
      if (state === "menu") return;
      const cycle = 760;
      const phase = signDistance % cycle;
      if (phase > 650) return;

      const t = phase / 650;
      const y = H * (0.10 + t * 0.67);
      const rw = roadWidthAt(y);
      const center = roadCenterAt(y);
      const leftRoad = center - rw / 2;
      const rightRoad = center + rw / 2;
      const side = Math.sin(Math.floor(signDistance / cycle) * 2.3) > 0 ? -1 : 1;
      const sx = side < 0 ? leftRoad - Math.min(74, W * 0.075) : rightRoad + Math.min(74, W * 0.075);
      const panelW = Math.min(150, Math.max(104, W * 0.205));
      const panelH = Math.max(82, Math.min(116, H * 0.19));
      const px = sx - panelW / 2;
      const py = y - panelH;
      const poleX = sx;

      ctx.save();
      ctx.lineCap = "round";
      ctx.lineWidth = Math.max(4, W * 0.009);
      ctx.strokeStyle = "#626a70";
      ctx.beginPath();
      ctx.moveTo(poleX, py + panelH);
      ctx.lineTo(poleX, Math.min(H, y + 16));
      ctx.stroke();

      ctx.fillStyle = "#c6cdd1";
      ctx.beginPath();
      ctx.ellipse(poleX, Math.min(H - 3, y + 16), 8, 3, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#0754a0";
      ctx.strokeStyle = "#dce9f4";
      ctx.lineWidth = 2;
      roundedRect(px, py, panelW, panelH, 4);
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = "#fff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "bold " + Math.max(9, Math.min(14, W * 0.021)) + "px Arial";
      ["BEYLİKDÜZÜ", "AVCILAR", "ESENYURT"].forEach((name, i) => {
        const yy = py + panelH * (0.20 + i * 0.30);
        ctx.fillText(name, sx, yy);
      });
      ctx.font = "bold " + Math.max(10, Math.min(16, W * 0.025)) + "px Arial";
      ctx.fillText(side < 0 ? "←" : "→", sx, py + panelH * 0.88);
      ctx.restore();
    }

    function drawRoad() {
      const rw = roadWidthAt(H * 0.5), left = W / 2 - rw / 2, right = W / 2 + rw / 2;

      // Zengin çim zemini.
      const grass = ctx.createLinearGradient(0, 0, 0, H);
      grass.addColorStop(0, "#4d963f");
      grass.addColorStop(.48, "#438b3d");
      grass.addColorStop(1, "#3b8139");
      ctx.fillStyle = grass;
      ctx.fillRect(0, 0, W, H);

      // Sade çim zemini.

      // Asfalt ve hafif gerçekçi şerit dokusu.
      const asphalt = ctx.createLinearGradient(left, 0, right, 0);
      asphalt.addColorStop(0, "#292e34");
      asphalt.addColorStop(.5, "#30353b");
      asphalt.addColorStop(1, "#292e34");
      ctx.fillStyle = asphalt;
      ctx.fillRect(left, 0, rw, H);

      // Asfaltı tamamen temiz bırakıyoruz; hareketli yatay bant/çizgi yok.

      // Yol kenarı asfalt bordürü.
      ctx.fillStyle = "#70756e";
      ctx.fillRect(left - 6, 0, 6, H);
      ctx.fillRect(right, 0, 6, H);
      ctx.fillStyle = "#f3f0dc";
      ctx.fillRect(left, 0, 4, H);
      ctx.fillRect(right - 4, 0, 4, H);

      // Şerit çizgileri.
      for (let lane = 1; lane < 4; lane++) {
        const x = left + rw * lane / 4;
        ctx.setLineDash([28, 26]);
        ctx.lineDashOffset = roadScroll * 90;
        ctx.strokeStyle = "rgba(248,246,226,.86)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      // Referanstaki kırmızı-beyaz yol kenarı dikmeleri.
      for (let y = -30; y < H + 30; y += 115) {
        const yy = y + ((roadScroll * H * .56) % 115);
        for (const side of [-1, 1]) {
          const x = side < 0 ? left - 18 : right + 18;
          ctx.fillStyle = "#ecece5";
          ctx.fillRect(x - 2.5, yy, 5, 19);
          ctx.fillStyle = "#d63a31";
          ctx.fillRect(x - 2.5, yy, 5, 6);
        }
      }

    }

    function drawFallbackCar(x, y, w, h, color) {
      ctx.save(); ctx.translate(x, y);
      ctx.fillStyle = color; roundedRect(-w / 2, -h / 2, w, h, w * 0.18); ctx.fill();
      ctx.fillStyle = "#173f58"; roundedRect(-w * 0.23, -h * 0.28, w * 0.46, h * 0.20, w * 0.05); ctx.fill();
      ctx.fillStyle = "#ff4040"; roundedRect(-w * 0.34, h * 0.37, w * 0.18, h * 0.07, w * 0.02); ctx.fill();
      roundedRect(w * 0.16, h * 0.37, w * 0.18, h * 0.07, w * 0.02); ctx.fill();
      ctx.restore();
    }

    function drawVehicle(kind, x, y, w, h, damaged = false, angle = 0) {
      ctx.save();
      ctx.translate(x, y); ctx.rotate(angle);
      ctx.fillStyle = "rgba(0,0,0,.30)";
      ctx.beginPath(); ctx.ellipse(0, h * 0.47, w * 0.57, h * 0.15, 0, 0, Math.PI * 2); ctx.fill();
      const sprite = sprites[kind];
      if (sprite) ctx.drawImage(sprite, -w / 2, -h / 2, w, h);
      else drawFallbackCar(0, 0, w, h, kind === "linea" ? "#16191d" : kind === "clioOrange" ? "#ff6a00" : kind === "peugeot" ? "#e9edf2" : "#f5f5f5");
      if (damaged) {

    function drawDrivingWake(player) {
      if (state !== "playing") return;
      const strength = clamp((speed - 80) / 130, 0.18, 1) * (1 - brakeAmount * 0.62);
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      for (let i = 0; i < 3; i++) {
        const spread = player.w * (0.13 + i * 0.12);
        const length = player.h * (0.42 + i * 0.17) * strength;
        const glow = ctx.createLinearGradient(player.x, player.y + player.h * 0.27, player.x, player.y + player.h * 0.27 + length);
        glow.addColorStop(0, "rgba(226, 238, 255, 0)");
        glow.addColorStop(1, "rgba(226, 238, 255, " + (0.04 + strength * 0.055) + ")");
        ctx.strokeStyle = glow; ctx.lineWidth = Math.max(1, player.w * 0.026); ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(player.x + (i - 1) * spread, player.y + player.h * 0.29);
        ctx.lineTo(player.x + (i - 1) * spread * 1.35, player.y + player.h * 0.29 + length);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawRoadSpeedLines() {
      if (state !== "playing" || speed < 90) return;
      const strength = clamp((speed - 90) / 115, 0, 1);
      ctx.save(); ctx.lineCap = "round";
      for (let i = 0; i < 12; i++) {
        const x = W * .08 + ((i * 83) % Math.max(1, W * .84));
        const y = ((i * 137 + roadScroll * H * 1.7) % (H + 80)) - 40;
        ctx.strokeStyle = "rgba(230,238,245," + (.03 + strength * .06) + ")";
        ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+8+strength*22); ctx.stroke();
      }
      ctx.restore();
    }

    function drawBrakeMarks(player) {
      if (brakeAmount < 0.04) return;
      ctx.save(); ctx.globalAlpha = brakeAmount * 0.30; ctx.strokeStyle = "#161719"; ctx.lineWidth = Math.max(2, player.w * 0.035); ctx.lineCap = "round";
      for (const side of [-1, 1]) {
        const x = player.x + side * player.w * 0.26;
        ctx.beginPath(); ctx.moveTo(x, player.y + player.h * 0.34); ctx.lineTo(x + side * player.w * 0.06, player.y + player.h * (0.70 + brakeAmount * 0.38)); ctx.stroke();
      }
      ctx.restore();
    }

    function drawBrakeLights(player) {
      if (brakeAmount < 0.04) return;
      ctx.save(); ctx.globalCompositeOperation = "screen"; ctx.globalAlpha = 0.52 + brakeAmount * 0.44;
      for (const side of [-1, 1]) {
        const x = player.x + side * player.w * 0.23, y = player.y + player.h * 0.34;
        const light = ctx.createRadialGradient(x, y, 1, x, y, player.w * 0.24);
        light.addColorStop(0, "rgba(255,105,80,.92)"); light.addColorStop(0.35, "rgba(248,35,22,.45)"); light.addColorStop(1, "rgba(255,30,10,0)");
        ctx.fillStyle = light; ctx.beginPath(); ctx.arc(x, y, player.w * 0.24, 0, Math.PI * 2); ctx.fill();
      }

    function drawBrakeIndicator() {
      if (state !== "playing" || brakeAmount < 0.06) return;

      ctx.fillStyle = "rgba(116,14,10,.76)"; roundedRect(W / 2 - 45, H * 0.48 - 18, 90, 36, 18); ctx.fill();

    function drawBurningAura(player) {
      if (state !== "burning") return;
      const flicker = 0.84 + Math.sin(performance.now() * 0.023) * 0.12 + Math.random() * 0.10;
      ctx.save(); ctx.globalCompositeOperation = "screen";
      const glow = ctx.createRadialGradient(player.x, player.y + player.h * 0.24, 4, player.x, player.y + player.h * 0.24, player.w * 0.95);
      glow.addColorStop(0, "rgba(255,245,152," + (0.34 * flicker) + ")");

      glow.addColorStop(1, "rgba(255,60,0,0)");
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.ellipse(player.x, player.y + player.h * 0.30, player.w * 0.90, player.h * 0.43, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

    function drawParticles() {
      for (const p of particles) {
        const alpha = clamp(p.life / p.maxLife, 0, 1);
        ctx.save(); ctx.globalAlpha = alpha;
        if (p.type === "smoke") {
          const smoke = ctx.createRadialGradient(p.x - p.size * 0.2, p.y - p.size * 0.2, 1, p.x, p.y, p.size);
          smoke.addColorStop(0, "rgba(78,79,82,.82)"); smoke.addColorStop(0.68, "rgba(37,38,41,.55)"); smoke.addColorStop(1, "rgba(25,26,29,0)");
          ctx.fillStyle = smoke; ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size, p.size * 0.78, p.vx * 0.003, 0, Math.PI * 2); ctx.fill();
        } else if (p.type === "ember") {
          ctx.fillStyle = p.life > p.maxLife * 0.5 ? "#fff0a3" : "#ff6d13";
          ctx.translate(p.x, p.y); ctx.rotate(p.vx * 0.012); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        } else if (p.type === "shock") {
          ctx.strokeStyle = "#ffbf4e"; ctx.lineWidth = Math.max(1, 4 * alpha); ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.stroke();
        } else {
          ctx.translate(p.x, p.y); ctx.rotate(p.vx * 0.003);
          const height = p.size * 1.75;
          const flame = ctx.createRadialGradient(0, p.size * 0.18, 1, 0, 0, height);
          flame.addColorStop(0, "#fff5af"); flame.addColorStop(0.32, "#ffc11c"); flame.addColorStop(0.70, "#ff5414"); flame.addColorStop(1, "rgba(221,39,8,0)");
          ctx.fillStyle = flame;
          ctx.beginPath(); ctx.moveTo(0, -height);
          ctx.quadraticCurveTo(p.size * 0.92, -p.size * 0.05, p.size * 0.55, p.size * 0.57);
          ctx.quadraticCurveTo(0, p.size * 0.92, -p.size * 0.55, p.size * 0.57);
          ctx.quadraticCurveTo(-p.size * 0.92, -p.size * 0.05, 0, -height); ctx.fill();
        }
        ctx.restore();
      }
    }

    function drawSpeedometer() {
      const radius = clamp(W * 0.115, 45, 62);
      const cx = radius + 14, cy = radius + 14, start = Math.PI * 0.76, sweep = Math.PI * 1.48;
      ctx.save();
      ctx.shadowColor = "rgba(0,0,0,.42)"; ctx.shadowBlur = 9; ctx.shadowOffsetY = 3;
      const shell = ctx.createRadialGradient(cx - radius * 0.22, cy - radius * 0.28, 3, cx, cy, radius);
      shell.addColorStop(0, "#4b5056"); shell.addColorStop(0.80, "#171b1f"); shell.addColorStop(1, "#e1e4e7");
      ctx.fillStyle = shell; ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.fill();
      ctx.shadowColor = "transparent"; ctx.fillStyle = "#14171a"; ctx.beginPath(); ctx.arc(cx, cy, radius * 0.88, 0, Math.PI * 2); ctx.fill();
      for (let i = 0; i <= 22; i++) {
        const angle = start + sweep * i / 22, major = i % 2 === 0;
        const outer = radius * 0.76, inner = outer - (major ? radius * 0.15 : radius * 0.09);
        ctx.strokeStyle = major ? "#f1f3f4" : "#969ca3"; ctx.lineWidth = major ? 2.4 : 1.2;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(angle) * inner, cy + Math.sin(angle) * inner);
        ctx.lineTo(cx + Math.cos(angle) * outer, cy + Math.sin(angle) * outer); ctx.stroke();
        if (i % 4 === 0 && i < 22) {
          ctx.fillStyle = "#e8eaed"; ctx.font = "bold " + Math.max(8, radius * 0.16) + "px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText(String(i * 10), cx + Math.cos(angle) * radius * 0.52, cy + Math.sin(angle) * radius * 0.52);
        }
      }
      const needle = start + sweep * clamp(speed / 210, 0, 1);
      ctx.strokeStyle = "#f34236"; ctx.lineWidth = Math.max(3, radius * 0.065); ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(needle) * radius * 0.62, cy + Math.sin(needle) * radius * 0.62); ctx.stroke();
      ctx.fillStyle = "#2d3034"; ctx.beginPath(); ctx.arc(cx, cy, radius * 0.15, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#efefef"; ctx.font = "bold " + Math.max(9, radius * 0.18) + "px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
      ctx.fillText("km/h", cx, cy + radius * 0.27);
      ctx.fillStyle = "#cf2522"; roundedRect(cx - radius * 0.37, cy + radius * 0.37, radius * 0.74, radius * 0.27, radius * 0.04); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = "bold " + Math.max(11, radius * 0.23) + "px monospace"; ctx.textBaseline = "middle";
      ctx.fillText(String(Math.floor(speed)).padStart(3, "0"), cx, cy + radius * 0.51);
      ctx.restore();
    }

    function drawHUD() {

      ctx.fillText("SKOR  " + Math.floor(score), x + 14, 43); ctx.fillText("MESAFE  " + (distance / 1000).toFixed(2) + " KM", x + 14, 67);

      }
      ctx.fillStyle = "rgba(255,255,255,.16)"; ctx.beginPath(); ctx.arc(W - 36, 33, 18, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.fillRect(W - 42, 23, 4, 20); ctx.fillRect(W - 34, 23, 4, 20);
      ctx.restore();
    }

    function drawTouchControls() {
      if (state !== "playing" && state !== "paused") return;
      const r = Math.min(48, W * 0.095);
      const y = H - r - 24;
      ctx.save();
      function button(x, yy, radius, label, active) {
        ctx.fillStyle = active ? "rgba(255,205,60,.82)" : "rgba(8,14,21,.58)";
        ctx.strokeStyle = "rgba(255,255,255,.78)"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(x, yy, radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#fff"; ctx.font = "bold " + Math.max(12, radius * 0.28) + "px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";

      button(W - r - 24, y, r, "›", false);
      const gasX = W / 2 + 58, gasY = H - 66;

      button(brakeX, brakeY, 34, "FREN", braking);

    function drawOverlay() {
      if (state !== "menu" && state !== "paused" && state !== "gameover") return;
      ctx.save(); ctx.fillStyle = "rgba(4,8,12,.46)"; ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = "#fff"; ctx.font = "bold 22px Arial"; ctx.fillText("Skor: " + finalScore, W / 2, H * 0.46);
        ctx.font = "14px Arial"; ctx.fillText("Mesafe: " + (distance / 1000).toFixed(2) + " KM", W / 2, H * 0.51);
        ctx.fillText("En iyi skor: " + bestScore, W / 2, H * 0.56);
        ctx.fillStyle = "#ffcf33"; ctx.font = "bold 20px Arial"; ctx.fillText("Tekrar başlamak için dokun veya ENTER'a bas", W / 2, H * 0.67);

    function draw() {
      ctx.clearRect(0, 0, W, H);
      if (garageOpen) return;
      drawSky();
      const cameraX = state === "playing" ? playerLaneVelocity * 0.18 : 0;
      const cameraY = 0;
      ctx.save(); ctx.translate(cameraX, cameraY);
      drawRoad(); drawPassengers(); drawRoadSigns(); drawRoadSpeedLines(); drawScoreCoins();
      cars.slice().sort((a, b) => a.z - b.z).forEach(car => {
        const g = otherCarGeometry(car);
        drawVehicle(car.kind || "clio", g.x, g.y, g.w, g.h, car.crashed);
      });
      const player = playerGeometry();
      drawDrivingWake(player);
      drawBrakeMarks(player);
      drawBurningAura(player);
      const steer = clamp(playerLaneVelocity * 0.048, -0.14, 0.14) + (state === "playing" ? Math.sin(drivePhase) * 0.008 : 0);
      drawVehicle(selectedVehicle, player.x, player.y, player.w, player.h, state === "burning", steer);
      drawBrakeLights(player);
      drawParticles();
      ctx.restore();
      drawScorePopups();
      drawHUD(); drawTouchControls(); drawBrakeIndicator();
      if (state === "burning") {
        ctx.save(); ctx.textAlign = "center"; ctx.fillStyle = "#ffdc63"; ctx.font = "bold 24px Arial";
        ctx.fillText("YANMA SİSTEMİ DEVREDE!", W / 2, H * 0.16); ctx.restore();
      }
      drawOverlay();
    }

    function loop(now) {
      const dt = Math.min(0.033, (now - lastTime) / 1000);
      lastTime = now;
      update(dt); draw(); requestAnimationFrame(loop);
    }

    window.addEventListener("keydown", event => {
      const key = event.key.toLowerCase();
      if (["arrowleft", "arrowright", "arrowup", "a", "d", "w", "s", "p", "escape", "enter", " "].includes(key)) event.preventDefault();
      if (event.repeat) return;
      if (passengerDialogOpen) return;
      if (state === "menu" || state === "gameover") {
        if (state === "gameover" && (key === "enter" || key === " ")) resetGame();
        return;
      }
      if (key === "p" || key === "escape") { togglePause(); return; }
      if (state === "paused" && (key === "enter" || key === " ")) { togglePause(); return; }
      if (state === "playing" && (key === "s" || key === " ")) { braking = true; return; }
      if (state === "playing" && (key === "w" || key === "arrowup")) { accelerating = true; return; }
      if (key === "arrowleft" || key === "a") moveLane(-1);
      if (key === "arrowright" || key === "d") moveLane(1);
    });

    window.addEventListener("keyup", event => {
      const key = event.key.toLowerCase();
      if (key === "s" || key === " ") { event.preventDefault(); braking = false; }
      if (key === "w" || key === "arrowup") { event.preventDefault(); accelerating = false; }
    });
    window.addEventListener("blur", () => { braking = false; accelerating = false; brakePointerId = null; gasPointerId = null; });

    canvas.addEventListener("pointerdown", event => {
      event.preventDefault();
      if (garageOpen) return;
      const rect = canvas.getBoundingClientRect();
      const x = (event.clientX - rect.left) * W / rect.width;
      const y = (event.clientY - rect.top) * H / rect.height;
      if (state === "gameover") { resetGame(); return; }
      if (state === "menu") return;
      if (state === "paused") {
        const bw = Math.min(270, W * 0.68), bh = 52, bx = W / 2 - bw / 2, by = H * 0.55;
        if (x >= bx && x <= bx + bw && y >= by && y <= by + bh) { openHome(); return; }
        togglePause(); return;
      }
      if (state !== "playing") return;

      // GEÇİCİ TEST: Sol üstteki hız göstergesine dokununca mesafeyi 9 KM'ye getir.
      const speedoRadius = clamp(W * 0.115, 45, 62);
      const speedoX = speedoRadius + 14, speedoY = speedoRadius + 14;
      if (Math.hypot(x - speedoX, y - speedoY) <= speedoRadius) {
        if (distance < 9000) distance = 9000;
        return;
      }

      if (x > W - 72 && y < 70) { togglePause(); return; }

      const r = Math.min(48, W * 0.095);
      const steerY = H - r - 24;
      const gasX = W / 2 + 58, gasY = H - 66;
      const brakeX = W / 2 - 58, brakeY = H - 66;
      const dist = (ax, ay) => Math.hypot(x - ax, y - ay);

      if (dist(gasX, gasY) < 48) {
        accelerating = true; gasPointerId = event.pointerId;
        try { canvas.setPointerCapture(event.pointerId); } catch (_) {}
        return;
      }
      if (dist(brakeX, brakeY) < 48) {
        braking = true; brakePointerId = event.pointerId;
        try { canvas.setPointerCapture(event.pointerId); } catch (_) {}
        return;
      }
      if (dist(r + 24, steerY) < r + 14) { moveLane(-1); return; }
      if (dist(W - r - 24, steerY) < r + 14) { moveLane(1); return; }
    });

    function releaseBrakePointer(event) {
      if (event.pointerId === brakePointerId) {
        braking = false; brakePointerId = null;
      }
      if (event.pointerId === gasPointerId) {
        accelerating = false; gasPointerId = null;
      }
      try { canvas.releasePointerCapture(event.pointerId); } catch (_) {}
    }
    canvas.addEventListener("pointerup", releaseBrakePointer);
    canvas.addEventListener("pointercancel", releaseBrakePointer);

    requestAnimationFrame(loop);
  })();
  </script>
</body>
